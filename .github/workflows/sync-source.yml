name: sync-source
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-source
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download and verify public source
        env:
          PUBLIC_REPOSITORY: ${{ github.event.repository.name }}
        run: node scripts/sync-source.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Update source after verification
        run: |
          git config user.name unmap-bot
          git config user.email unmap-bot@users.noreply.github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Update public source and examples'
            git push origin HEAD:main
          fi
